[project]
name = "headlong-web"
version = "0.1.0"
description = "Web viewer for Headlong mind logs and trajectory trees"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pywebpush>=2.0",
]

[project.scripts]
headlong-web = "headlong_web.cli:main"
headlong-assistant = "headlong_web.assistant_cli:main"
headlong-archive-boundary = "headlong_web.archive_boundary:main"

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headlong_web"]
